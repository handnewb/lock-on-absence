# ══════════════════════════════════════════════════════════════════════════
#  Splunk sourcetype for lock-on-absence --siem output
#
#  Deploy to: $SPLUNK_HOME/etc/apps/lock_on_absence/local/props.conf
#
#  NOTE ON FORMAT: this project emits JSON Lines, which is what Splunk ingests
#  best. CEF is ArcSight's format and LEEF is QRadar's -- converting to either
#  for Splunk would flatten structured objects into key=value and LOSE fidelity.
#  What actually makes these events useful in Splunk Enterprise Security is CIM
#  compliance, which is what the EVAL/FIELDALIAS lines below provide.
# ══════════════════════════════════════════════════════════════════════════

[lock_on_absence:json]
INDEXED_EXTRACTIONS = json
KV_MODE             = none
TIMESTAMP_FIELDS    = timestamp
TIME_FORMAT         = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 32
SHOULD_LINEMERGE    = false
LINE_BREAKER        = ([\r\n]+)
TRUNCATE            = 8192
category            = Security
description         = Lock on Absence presence-detection audit events

# ── CIM: Authentication data model ────────────────────────────────────────
# A screen lock is a session-termination event. Mapping it into Authentication
# is what lets ES correlation searches see it alongside logon/logoff activity.
FIELDALIAS-loa_dest   = hostname AS dest
FIELDALIAS-loa_host   = hostname AS dvc
EVAL-app              = "lock-on-absence"
EVAL-vendor_product   = "handnewb lock-on-absence"
EVAL-action           = case(
    event_id==1005, "failure",
    like(event, "%_lock"), "success",
    1==1, "unknown")
EVAL-signature        = event
EVAL-signature_id     = tostring(event_id)
EVAL-severity         = case(
    level=="ERROR", "high",
    level=="WARN",  "medium",
    level=="INFO",  "low",
    1==1, "informational")

# ── CIM: Change data model (session state changed) ────────────────────────
EVAL-object_category  = "session"
EVAL-object           = "workstation_screen"
EVAL-status           = if(event_id==1005, "failure", "success")

# ── Domain-specific enrichment ────────────────────────────────────────────
# dry_run MUST be surfaced. Without it a --no-lock rehearsal is
# indistinguishable from a real lock and the audit trail is worthless.
EVAL-is_dry_run       = if(dry_run=="true" OR dry_run==1, 1, 0)
EVAL-lock_reason      = coalesce(reason, "n/a")
EVAL-is_security_relevant = if(event_id IN (1001, 1003, 1005, 2001, 2002), 1, 0)

# ── Field metadata for the UI ─────────────────────────────────────────────
LOOKUP-loa_event_desc = loa_event_lookup event_id OUTPUT event_description
